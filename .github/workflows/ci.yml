name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build installer
        shell: pwsh
        run: ./build.ps1 -Version v4.5.0 -Commit $env:GITHUB_SHA
      - name: Smoke-test headless CLI
        shell: pwsh
        run: |
          $result = & ./dist/WallpaperIdentityCLI.exe version --json | ConvertFrom-Json
          if (-not $result.success -or $result.schema_version -ne 1 -or $result.command -ne 'version') {
            throw "Unexpected CLI result: $($result | ConvertTo-Json -Compress)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: WallpaperIdentitySetup
          path: |
            dist/WallpaperIdentitySetup.exe
            dist/WallpaperIdentityCLI.exe
            dist/SHA256SUMS.txt
