# Wallpaper Identity (W:ID) power-user configuration.
# Copy this file, edit it, and deploy with:
# WallpaperIdentityCLI.exe install --json --config C:\RMM\config.yml
# Hostname and the timezone-qualified Generated at timestamp are always shown.
preset: custom
refresh_minutes: 5
# Required on Windows Pro. This enables Microsoft's SetEduPolicies compatibility
# switch, which disables Windows tips, advertising ID, and consumer experiences.
enable_pro_compatibility: true
# Windows owns a boot-time bitmap cache. When no user is signed in, rotate the
# empty console session once per boot so it reloads the newly generated image.
refresh_login_screen_on_boot: true
# Leave base_image empty to discover background.jpg or background.png beside
# the installed config.yml. An absolute path remains useful for RMM-managed art.
# The graphical installer snapshots the existing Windows login background into
# this standard location on a truly fresh install; config.yml stores no live link.
base_image: ""
# Six color families × Dark/Light provide twelve built-in backdrops.
background_color: blue
background_mode: dark
# Leave both at 0 for detected resolution plus aspect-aware fallbacks.
width: 0
height: 0
show:
  os: true
  build: true
  cpu: true
  gpu: true
  memory: true
  disk: true
  ip: true
  serial: true
  uptime: true
  services: true
  restart: true
  critical_services: true
  failed_auto_services: false
